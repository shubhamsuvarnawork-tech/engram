apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: company-brain
spec:
  replicas: 2
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-org/company-brain-backend:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - secretRef: { name: backend-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: company-brain
spec:
  selector: { app: backend }
  ports: [{ port: 80, targetPort: 8000 }]
